name: Publish contribution animations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: contribution-animation-publish
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -v
          python -m ruff check .
      - name: Generate live SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          CONTRIBUTION_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from contribution_dynamic.collector import collect
          from contribution_dynamic.publish import build_assets

          days = collect(os.environ["CONTRIBUTION_USER"], os.environ["GITHUB_TOKEN"])
          files = build_assets(days, Path("generated"))
          print(f"Generated {len(files)} SVG files from {len(days)} calendar days.")
          # Separate deterministic gallery, never sourced from account data.
          from contribution_dynamic.calendar import demo_calendar
          build_assets(demo_calendar(42), Path("generated/demo"))
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: published-animations
          path: generated/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-animations
          path: ${{ runner.temp }}/contribution-animations
      - name: Publish to output branch
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git switch -c output --track origin/output
          else
            git switch --orphan output
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for retired in motion factory abyss; do
            for theme in dark light; do
              git rm --ignore-unmatch -- "$retired-$theme.svg" "demo/$retired-$theme.svg"
            done
          done
          for scenario in tanks blast chess invaders origami; do
            for theme in dark light; do
              file="$scenario-$theme.svg"
              cp "$RUNNER_TEMP/contribution-animations/$file" "$file"
              git add -- "$file"
              mkdir -p demo
              cp "$RUNNER_TEMP/contribution-animations/demo/$file" "demo/$file"
              git add -- "demo/$file"
            done
          done
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: update contribution animations"
          git push origin HEAD:refs/heads/output
