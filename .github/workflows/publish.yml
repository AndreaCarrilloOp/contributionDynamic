name: Publish contribution animations

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

concurrency:
  group: contribution-animation-publish
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install and validate
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -v
          python -m ruff check .
      - name: Generate live SVG assets
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          CONTRIBUTION_USER: ${{ github.repository_owner }}
        run: |
          python -m contribution_dynamic batch --user "$CONTRIBUTION_USER" --output-dir generated
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: published-animations
          path: generated/*.svg
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: published-animations
          path: ${{ runner.temp }}/contribution-animations
      - name: Publish to output branch
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/output; then
            git switch -c output --track origin/output
          else
            git switch --orphan output
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch -- demo
          for scenario in tanks blast chess invaders origami; do
            for theme in dark light; do
              file="$scenario-$theme.svg"
              cp "$RUNNER_TEMP/contribution-animations/$file" "$file"
              git add -- "$file"
            done
          done
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: update contribution animations"
          git push origin HEAD:refs/heads/output
