name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'action.yml'
      - 'requirements*.txt'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'action.yml'
      - 'requirements*.txt'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: |
          python -m coverage run -m pytest -v
          python -m coverage report
          python -m coverage xml -o coverage.xml
      - name: Lint
        run: python -m ruff check .
      - name: Benchmark representative calendars
        run: python scripts/benchmark.py --output benchmark.json
      - name: Upload quality reports
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-reports
          path: |
            coverage.xml
            benchmark.json
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test composite action with demo data
        uses: ./
        with:
          output-dir: previews
      - name: Verify action output
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {f"{s}-{t}.svg" for s in ("factory", "origami", "abyss", "chess")
                      for t in ("dark", "light")}
          assert {p.name for p in Path("previews").glob("*.svg")} == expected
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-previews
          path: previews/*.svg
          if-no-files-found: error
          retention-days: 7
