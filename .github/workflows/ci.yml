name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - 'action.yml'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - 'action.yml'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: |
          python -m coverage run -m pytest -v
          python -m coverage report
          python -m coverage xml -o coverage.xml
      - name: Lint
        run: python -m ruff check .
      - name: Benchmark representative calendars
        run: python scripts/benchmark.py --output benchmark.json
      - name: Upload quality reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports
          path: |
            coverage.xml
            benchmark.json
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test composite action without credentials
        uses: ./
        with:
          output-dir: previews
      - name: Verify action output
        run: |
          python - <<'PY'
          from pathlib import Path
          from contribution_dynamic.registry import PUBLISHED_SCENARIOS, THEMES
          expected = {f"{s}-{t}.svg" for s in PUBLISHED_SCENARIOS for t in THEMES}
          assert {p.name for p in Path("previews").glob("*.svg")} == expected
          PY
