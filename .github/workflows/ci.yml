name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -v
      - name: Lint
        run: python -m ruff check .
      - name: Generate demo previews
        run: |
          for scenario in factory origami abyss; do
            for theme in dark light; do
              python -m contribution_dynamic generate --scenario "$scenario" \
                --theme "$theme" --output "previews/$scenario-$theme.svg"
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: demo-previews
          path: previews/*.svg
          if-no-files-found: error
          retention-days: 7
