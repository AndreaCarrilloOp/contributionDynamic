name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'action.yml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'action.yml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -v
      - name: Lint
        run: python -m ruff check .
      - name: Smoke-test composite action with demo data
        uses: ./
        with:
          output-dir: previews
      - name: Verify action output
        run: |
          python - <<'PY'
          from pathlib import Path
          expected = {f"{s}-{t}.svg" for s in ("factory", "origami", "abyss", "chess")
                      for t in ("dark", "light")}
          assert {p.name for p in Path("previews").glob("*.svg")} == expected
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: demo-previews
          path: previews/*.svg
          if-no-files-found: error
          retention-days: 7
