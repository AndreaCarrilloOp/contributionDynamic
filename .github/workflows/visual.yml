name: Browser compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'pyproject.toml', '.github/workflows/visual.yml']

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[visual]'
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python scripts/browser_check.py --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: visual-${{ matrix.browser }}
          path: visual-report/**/*.png
          if-no-files-found: warn
          retention-days: 7
