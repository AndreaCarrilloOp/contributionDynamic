name: Validate GitHub GraphQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -v
          python -m ruff check .
      - name: Fetch real contribution calendar and render
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          CONTRIBUTION_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from contribution_dynamic.collector import collect
          from contribution_dynamic.publish import build_assets

          days = collect(os.environ["CONTRIBUTION_USER"], os.environ["GITHUB_TOKEN"])
          build_assets(days, Path("artifacts"))
          print(f"GraphQL OK: {len(days)} calendar days received.")
          PY
      - name: Upload SVG previews
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: contribution-previews
          path: artifacts/*.svg
          if-no-files-found: error
          retention-days: 7
